<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Birchline UI — Design System</title>
    <script>
      // Apply theme (palette × mode) before first paint so the initial render is
      // already themed — avoids a flash and the transition-colors "stuck" state.
      (function () {
        try {
          var p = localStorage.getItem("birchline-palette");
          var m = localStorage.getItem("birchline-mode");
          var root = document.documentElement;
          if (p && p !== "default") root.setAttribute("data-theme", p);
          if (m === "dark") root.setAttribute("data-mode", "dark");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
