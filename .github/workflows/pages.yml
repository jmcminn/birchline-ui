name: Deploy registry to Pages

# Publishes the shadcn registry (public/r/*.json) + token artifacts to GitHub
# Pages so consumers can `npx shadcn add @birchline/*`. Rebuilds on every push
# to main, so the served registry always matches the source.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; let an in-progress run finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run registry:build # regenerates tokens + registry JSON
      - run: touch public/.nojekyll # serve JSON as-is, no Jekyll processing
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
