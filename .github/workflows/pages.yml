name: Deploy demo and registry to Pages

# Publishes the demo app (site root) and the shadcn registry (/r/*.json) to
# GitHub Pages, so consumers can `npx shadcn add @birchline/*` and anyone can
# open the live demo. Rebuilds on every push to main.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; let an in-progress run finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run registry:build # regenerates tokens + registry JSON
      - run: touch public/.nojekyll # serve JSON as-is, no Jekyll processing
      - run: npm run build # demo app -> dist/ (public/ incl. r/ is copied in)
        env:
          VITE_BASE: /birchline-ui/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
